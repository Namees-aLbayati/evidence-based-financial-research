name: App checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install React dependencies
        run: npm ci --prefix frontend
      - name: Build React interface
        run: npm run build --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install API test dependencies
        run: python -m pip install fastapi==0.162.0 python-dotenv 'httpx==0.28.1'
      - name: Test API contract without credentials or model calls
        run: python -m unittest tests.test_api -v
      - name: Check Python syntax
        run: python -m compileall -q backend tests
